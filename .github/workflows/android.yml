# Project: ANINGU
name: ANINGU Android & TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Configuration & Keystore
      env:
        KEYSTORE: ${{ secrets.KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        touch local.properties
        if [ -n "$KEYSTORE" ]; then
          printf '%s' "$KEYSTORE" | base64 -d > audify-release.jks
          {
            printf 'storeFile=audify-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          echo "HAVE_KEYSTORE=true" >> $GITHUB_ENV
        else
          echo "Using debug signing"
          echo "HAVE_KEYSTORE=false" >> $GITHUB_ENV
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build ANINGU Phone and TV APKs
      run: |
        if [ "$HAVE_KEYSTORE" = "true" ]; then
          ./gradlew :app:assembleProdRelease :tv:assembleProdRelease --no-daemon
        else
          ./gradlew :app:assembleDevDebug :tv:assembleDevDebug --no-daemon
        fi

    - name: Prepare & Rename APKs to ANINGU
      run: |
        mkdir -p build-output/phone build-output/tv
        PHONE_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        if [ -n "$PHONE_APK" ]; then
          cp "$PHONE_APK" build-output/phone/ANINGU.apk
          echo "Phone APK copied: build-output/phone/ANINGU.apk"
        fi
        TV_APK=$(find tv/build/outputs/apk -name "*.apk" | head -n 1)
        if [ -n "$TV_APK" ]; then
          cp "$TV_APK" build-output/tv/ANINGU-TV.apk
          echo "TV APK copied: build-output/tv/ANINGU-TV.apk"
        fi

    - name: Upload Phone APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ANINGU-Phone-APK
        path: build-output/phone/ANINGU.apk

    - name: Upload Android TV APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ANINGU-TV-APK
        path: build-output/tv/ANINGU-TV.apk

    - name: Publish Direct APK Download Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.0
        name: "ANINGU Music App v1.0.0"
        body: |
          ### ANINGU Music Release
          - **Phone APK:** `ANINGU.apk`
          - **Android TV APK:** `ANINGU-TV.apk`
          
          Features:
          - 72-hour device-bound free trial (no signup or payment required)
          - M-Pesa monthly subscriptions (Student, Duo, Family)
          - Music sources, player, lyrics, downloads & TV Leanback preserved
        files: |
          build-output/phone/ANINGU.apk
          build-output/tv/ANINGU-TV.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
