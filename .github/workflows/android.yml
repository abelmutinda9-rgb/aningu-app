# Project: ANINGU
name: ANINGU Android & TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Configuration & Keystore
      env:
        KEYSTORE: ${{ secrets.KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        touch local.properties
        if [ -n "$KEYSTORE" ]; then
          printf '%s' "$KEYSTORE" | base64 -d > audify-release.jks
          {
            printf 'storeFile=audify-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          echo "HAVE_KEYSTORE=true" >> $GITHUB_ENV
        else
          echo "Using debug signing"
          echo "HAVE_KEYSTORE=false" >> $GITHUB_ENV
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build ANINGU Phone and TV APKs
      run: |
        if [ "$HAVE_KEYSTORE" = "true" ]; then
          ./gradlew :app:assembleProdRelease :tv:assembleProdRelease --no-daemon
        else
          ./gradlew :app:assembleDevDebug :tv:assembleDevDebug --no-daemon
        fi

    - name: Upload Phone APK
      uses: actions/upload-artifact@v4
      with:
        name: aningu-phone-apk
        path: |
          app/build/outputs/apk/prod/release/*.apk
          app/build/outputs/apk/dev/debug/*.apk

    - name: Upload Android TV APK
      uses: actions/upload-artifact@v4
      with:
        name: aningu-tv-apk
        path: |
          tv/build/outputs/apk/prod/release/*.apk
          tv/build/outputs/apk/dev/debug/*.apk
